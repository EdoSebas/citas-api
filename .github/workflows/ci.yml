name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Instalar y verificar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Verificar sintaxis del codigo
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
          node --check recordatorios/index.js

      - name: Validar esquema de Prisma
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/citas

  imagenes:
    name: Construir y publicar imagenes
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Calcular etiqueta del commit
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/citas-backend:${{ env.SHORT_SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/citas-backend:latest

      - name: Construir y publicar imagen de recordatorios
        uses: docker/build-push-action@v6
        with:
          context: ./recordatorios
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/citas-recordatorios:${{ env.SHORT_SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/citas-recordatorios:latest
